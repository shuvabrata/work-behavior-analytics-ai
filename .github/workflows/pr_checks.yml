name: PR Checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      DATABASE_URL: postgresql+asyncpg://username:pwd@localhost:5432/postgres
      NEO4J_ENABLED: "false"
      OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
      LLM_MODEL: "gpt-4o"
      GITHUB_MCP_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.app.txt -r requirements.github-producer.txt -r requirements.jira-producer.txt -r requirements.confluence-producer.txt -r requirements_dev.txt

      - name: Run unit tests
        run: pytest -q -m unit tests --cov=src --cov-report=term-missing:skip-covered

  check-spec-freshness:
    name: Spec doc is up to date
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.app.txt

      - name: Regenerate spec
        run: python scripts/generate_signal_activity_spec.py

      - name: Fail if spec is stale
        run: |
          if ! git diff --exit-code docs/design/spec-activity-signal.md; then
            echo ""
            echo "❌  docs/design/spec-activity-signal.md is out of date."
            echo "    Run the following locally and commit the result:"
            echo ""
            echo "        PYTHONPATH=src python scripts/generate_signal_activity_spec.py"
            echo ""
            exit 1
          fi

  pylint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.app.txt -r requirements.github-producer.txt -r requirements.jira-producer.txt -r requirements.confluence-producer.txt -r requirements_dev.txt

      - name: Run pylint on src
        run: |
          SCORE=$(pylint src --score=y --exit-zero | tee pylint.log | grep 'Your code has been rated at' | awk '{print $7}' | cut -d'/' -f1)
          PASS=$(echo "$SCORE >= 9.0" | bc)
          if [ "$PASS" -ne 1 ]; then
            echo "Pylint score is less than 9.0 ($SCORE). Failing the job."
            exit 1
          fi
          echo "Pylint score is $SCORE."

  mypy:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.app.txt -r requirements.github-producer.txt -r requirements.jira-producer.txt -r requirements.confluence-producer.txt -r requirements_dev.txt

      - name: Run mypy
        run: mypy src/

  security-bandit:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Generate SARIF report
        run: |
          bandit -c .bandit.yml -r src/ -f sarif -o bandit-results.sarif || true

      - name: Run Bandit Security Scan (Fail on High severity)
        run: |
          bandit -c .bandit.yml -r src/ -lll

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit
