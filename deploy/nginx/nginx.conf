events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Dash callback payloads (collaboration network) exceed nginx's 1m default.
    client_max_body_size 50m;

    # Upstreams are the compose service names; resolved on the wba-ai-network.
    # The API and the UI are separate services since Plan 052 — the API owns
    # /api/* and the UI owns /app/*, so each has its own upstream.
    upstream wba_api {
        server api:8000;
    }

    upstream wba_ui {
        server ui:8000;
    }

    server {
        listen 80;
        # Redirect plaintext to TLS rather than serving anything.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name localhost;

        ssl_certificate     /etc/nginx/certs/wba.pem;
        ssl_certificate_key /etc/nginx/certs/wba-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ── SSE stream: never buffer, never time out early ──────────────
        # The browser calls this directly (src/ui/assets/stream-bridge.js).
        # With buffering on, nginx holds the response and the user sees
        # nothing until it completes. Longest-prefix match means this wins
        # over `location /api` below regardless of file order.
        location /api/v1/chats/ {
            proxy_pass http://wba_api;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # ── API ─────────────────────────────────────────────────────────
        location /api {
            proxy_pass http://wba_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # ── API documentation (deliberately unauthenticated) ─────────────
        # FastAPI's defaults — /docs (Swagger UI), /redoc and /openapi.json —
        # served by the API and proxied here. No docs_url/redoc_url/openapi_url
        # override is set in src/app/api_main.py, so these are the real paths.
        #
        # Prefix matches, not exact: /docs/oauth2-redirect is Swagger's OAuth2
        # callback and lives below /docs. Nothing else claims these prefixes.
        #
        # No root_path is set, so the schema emits no `servers` entry and
        # Swagger resolves "Try it out" against the page origin — which is why
        # these three must be proxied to the API and not to the UI.
        #
        # The UIs load their JS/CSS from a CDN, so /docs and /redoc render blank
        # without egress to the browser.
        location /docs {
            proxy_pass http://wba_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        location /redoc {
            proxy_pass http://wba_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        location /openapi.json {
            proxy_pass http://wba_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # ── Dash UI (extends to /app/assets/*, /app/_dash-*) ─────────────
        # No trailing slash on proxy_pass: the /app prefix is preserved,
        # which is what requests_pathname_prefix="/app/" and
        # routes_pathname_prefix="/app/" in src/ui/layout.py expect.
        location /app {
            proxy_pass http://wba_ui;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        location = / {
            return 302 /app;
        }

        # ── Keycloak OIDC realm endpoints (Plan C) ───────────────────────
        # ONLY /auth/realms/* is proxied. The admin console and admin REST
        # (/auth/admin*) are deliberately NOT routed: they are the highest-
        # privilege surface in the stack, and nothing in the app needs them
        # from a browser. The operator reaches the console on the loopback
        # port 127.0.0.1:8080 published by the keycloak service.
        location /auth/realms/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # Keycloak theme assets (login page, account console). Their CSS/JS
        # live here, not under /auth/realms/. Longest-prefix match keeps this
        # ahead of the /auth catch-all below.
        location /auth/resources/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # Anything else under /auth (including /auth/admin) is explicitly
        # refused rather than falling through to an upstream.
        location /auth {
            return 404;
        }
    }
}
