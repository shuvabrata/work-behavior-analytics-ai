services:
  postgres:
    image: postgres:17
    container_name: wba-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: wba-ai-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    entrypoint: ["/opt/keycloak/entrypoint.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${EXTERNAL_BASE_URL:-https://localhost}/auth
      KC_HOSTNAME_ADMIN: http://127.0.0.1:8080/auth
      APP_PUBLIC_BASE_URL: ${EXTERNAL_BASE_URL:-https://localhost}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DEV_KEYCLOAK_ADMIN_PASSWORD}
      DEV_WBA_ADMIN_PASSWORD: ${DEV_WBA_ADMIN_PASSWORD}
      DEV_WBA_USER_PASSWORD: ${DEV_WBA_USER_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET}
    volumes:
      - ./deploy/keycloak/realm-wba.json.template:/opt/keycloak/realm-wba.json.template:ro
      - ./deploy/keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro
    # Admin console not published. See ADMIN_GUIDE.md to enable on 127.0.0.1:8080.
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/wba/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wba-ai-api
    restart: unless-stopped
    environment:
      # PostgreSQL connection settings for entrypoint script
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Override DATABASE_URL to use 'postgres' service name instead of 'localhost'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LLM_PROVIDER: ${LLM_PROVIDER}
      CUSTOM_LLM_MODEL: ${CUSTOM_LLM_MODEL}
      LLM_MODEL: ${LLM_MODEL}
      # Backward compatibility aliases (app uses LLM_MODEL)
      OPENAI_MODEL: ${OPENAI_MODEL}
      CUSTOM_MODEL: ${CUSTOM_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_URL: ${OPENAI_API_URL}
      CUSTOM_API_TOKEN: ${CUSTOM_API_TOKEN}
      CUSTOM_API_URL: ${CUSTOM_API_URL}
      MAX_TOKENS: ${MAX_TOKENS}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: /var/log/app
      ENABLE_FILE_LOGGING: "1"
      # Override NEO4J_URI to use 'neo4j' service name instead of 'localhost'
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_AI_LOOKUP_ENABLED: ${NEO4J_AI_LOOKUP_ENABLED:-true}
      #Github MCP server settings
      GITHUB_MCP_ENABLED: ${GITHUB_MCP_ENABLED:-false}
      GITHUB_MCP_TOKEN: ${GITHUB_MCP_TOKEN:-}
      # In Docker, use service-to-service networking, not localhost.
      GITHUB_MCP_SERVER_URL: http://github-mcp:8082/
      # RabbitMQ configuration
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      # Elasticsearch configuration
      ELASTICSEARCH_AI_LOOKUP_ENABLED: ${ELASTICSEARCH_AI_LOOKUP_ENABLED:-true}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
    volumes:
      # Mount .env file (read-only)
      - ./.env:/app/.env:ro
      # Mount logs directory
      - ./logs/app:/var/log/app
      # Persist user-defined query catalog overrides across container rebuilds.
      # Only the user_defined/ subtree is mounted so the system catalog stays
      # baked in the image and is refreshed on every image update.
      - catalog_user_defined:/app/queries_catalog/user_defined
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: wba-ai-ui
    restart: unless-stopped
    # Narrowed on purpose: the UI runtime holds no database URL, no data-store
    # credentials and no LLM provider key (Plan 052, Decision 1). Adding any of
    # DATABASE_URL / OPENAI_API_KEY / NEO4J_* / ELASTICSEARCH_* / GITHUB_MCP_* /
    # RABBITMQ_URL / CONNECTOR_ENCRYPTION_KEY here would defeat the split.
    environment:
      # The API over the Docker network, plain HTTP. Deliberately NOT the
      # browser-facing EXTERNAL_BASE_URL.
      API_BASE_URL: http://api:8000
      UI_DATE_FORMAT: ${UI_DATE_FORMAT:-%b %d, %Y}
      UI_DATETIME_FORMAT: ${UI_DATETIME_FORMAT:-%b %d, %Y %I:%M %p}
      TIMEZONE: ${TIMEZONE:-UTC}
      LOG_FORMAT: ${LOG_FORMAT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: /var/log/ui
      ENABLE_FILE_LOGGING: "1"
      GRAPH_UI_MAX_NODES_TO_EXPAND: ${GRAPH_UI_MAX_NODES_TO_EXPAND:-20}
      GRAPH_UI_MAX_NODE_LABEL_CHARS: ${GRAPH_UI_MAX_NODE_LABEL_CHARS:-10}
    volumes:
      # Logs only. Deliberately no .env mount and no catalog volume: the UI must
      # not be able to read the API's secrets or the query catalog from disk.
      - ./logs/ui:/var/log/ui
    networks:
      - wba-ai-network
    healthcheck:
      # Probes the UI's OWN liveness, not the API's — otherwise the UI goes
      # unhealthy when the API restarts and nginx's depends_on cascade follows.
      test: ["CMD", "curl", "-f", "http://localhost:8000/app/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  nginx:
    # Pinned to the current stable branch (1.30.x, currently 1.30.6). This is
    # a minor-version tag, not a digest — pulls can drift inside 1.30.x. Pin
    # to a digest if you need byte-identical reproducibility.
    image: nginx:1.30-alpine
    container_name: wba-ai-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      # Port 80 serves ONLY a 301 redirect to HTTPS (see the `listen 80`
      # server block). Publish it so a browser hitting http:// is upgraded
      # rather than timing out — it never serves application content.
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - wba-ai-network
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy

  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: wba-ai-github-mcp
    restart: unless-stopped
    command: ["http", "--port", "8082", "--read-only"]
    ports:
      - "8082:8082"
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_MCP_TOKEN}
      GITHUB_TOOLSETS: ${GITHUB_MCP_TOOLSETS:-default,issues,pull_requests,repos}
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD", "/server/github-mcp-server", "list-scopes"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    container_name: wba-ai-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      
  rabbitmq:
    image: rabbitmq:4-management
    container_name: wba-ai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: wba-ai-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - wba-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  github-producer:
    build:
      context: .
      dockerfile: Dockerfile.github-producer
    container_name: wba-ai-github-producer
    env_file:
      - .env
    environment:
      API_SERVER: http://api:8000/
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      PYTHONPATH: /app
      LOG_DIR: /var/log/github-producer
      CONTAINER_NAME: github-producer
    volumes:
      - ./logs/github-producer:/var/log/github-producer
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wba-ai-network

  jira-producer:
    build:
      context: .
      dockerfile: Dockerfile.jira-producer
    container_name: wba-ai-jira-producer
    env_file:
      - .env
    environment:
      API_SERVER: http://api:8000/
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      PYTHONPATH: /app
      LOG_DIR: /var/log/jira-producer
      CONTAINER_NAME: jira-producer
    volumes:
      - ./logs/jira-producer:/var/log/jira-producer
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wba-ai-network

  confluence-producer:
    build:
      context: .
      dockerfile: Dockerfile.confluence-producer
    container_name: wba-ai-confluence-producer
    env_file:
      - .env
    environment:
      API_SERVER: http://api:8000/
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      PYTHONPATH: /app
      LOG_DIR: /var/log/confluence-producer
      CONTAINER_NAME: confluence-producer
    volumes:
      - ./logs/confluence-producer:/var/log/confluence-producer
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wba-ai-network

  signal-consumer:
    build:
      context: .
      dockerfile: Dockerfile.signal-consumer
    deploy:
      replicas: ${SIGNAL_CONSUMER_REPLICAS:-1}
    env_file:
      - .env
    environment:
      API_SERVER: http://api:8000/
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      # Listen on all provider queues
      LISTEN_QUEUES: github_queue,jira_queue,confluence_queue
      PYTHONPATH: /app
      LOG_DIR: /var/log/signal-consumer
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      # Override DATABASE_URL to use 'postgres' service name instead of 'localhost'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
    volumes:
      - ./logs/signal-consumer:/var/log/signal-consumer
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped  # Long-running consumer; restart on failure
    networks:
      - wba-ai-network

networks:
  wba-ai-network:
    driver: bridge

volumes:
  elasticsearch_data:
  pgdata:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  rabbitmq_data:
  catalog_user_defined:
