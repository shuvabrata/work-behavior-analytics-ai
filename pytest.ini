[pytest]
pythonpath = src . tests
markers =
    unit: fast tests with no external service dependency
    integration: tests requiring external services or full-stack behavior
    server: tests that require the app server to be running
    authenticated: server tests whose requests need a real bearer; the conftest fixture attaches one
    neo4j: tests that require a live Neo4j instance
    rabbitmq: tests that require a live RabbitMQ instance
    elasticsearch: tests that require a live Elasticsearch instance
