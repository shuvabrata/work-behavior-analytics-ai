name: Cross Team Doc Bridges
description: |-
  **What it is:** Identifies specific wiki pages that actively tag or mention members from multiple distinct organizational teams.
  
  **How it helps:** Allows Program Managers to pinpoint critical cross-team alignment documents, such as API contracts, shared architecture specs, or incident post-mortems.
  
  **What-If Impact:** Without visibility into shared documentation, it is difficult to verify if complex cross-team dependencies are actually being formally negotiated and written down.
summary: "Documentation that mentions people from multiple teams."
default_view: tabular
owner: cross-domain-analytics
status: draft
queries:
  tabular: |-
    MATCH (doc)
    WHERE doc:Page OR doc:Blogpost
    MATCH (doc)-[:MENTIONS]->(person:Person)
    OPTIONAL MATCH (person)-[:MEMBER_OF]-(team:Team)
    WITH doc,
         count(DISTINCT person) as mentioned_people,
         count(DISTINCT team) as teams,
         collect(DISTINCT team.name)[0..10] as sample_teams
    WHERE teams >= 2
    RETURN labels(doc)[0] as content_type,
           doc.title as content_title,
           mentioned_people,
           teams,
           sample_teams
    ORDER BY teams DESC, mentioned_people DESC, content_title
    LIMIT 100
  graph: |-
    MATCH p1=(doc)-[:MENTIONS]->(person:Person)-[:MEMBER_OF]-(team:Team)
    WHERE doc:Page OR doc:Blogpost
    RETURN p1
    LIMIT 100
tags:
- table
- graph
