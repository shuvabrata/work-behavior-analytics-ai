name: Doc Vs Implementation Gap
description: |-
  **What it is:** Finds Confluence pages that link to Jira issues which, in turn, have absolutely zero linked code commits.
  
  **How it helps:** Acts as a reality check for Program Managers to identify "paperware"—architectural designs or requirements that were heavily documented but never actually built.
  
  **What-If Impact:** Failing to track implementation gaps can lead leadership to believe a feature is complete based on extensive documentation, when the actual code was never delivered.
summary: "Documentation that references work items with no code linkage."
default_view: tabular
owner: cross-domain-analytics
status: draft
queries:
  tabular: |-
    MATCH (doc)
    WHERE doc:Page OR doc:Blogpost
    MATCH (doc)-[:REFERENCES]->(i:Issue)
    WHERE NOT (i)<-[:REFERENCES]-(:Commit)
    RETURN labels(doc)[0] as content_type,
           doc.title as content_title,
           i.key as issue_key,
           i.status as issue_status,
           i.priority as priority
    ORDER BY content_title, issue_key
    LIMIT 100
  graph: |-
    MATCH p1=(doc)-[:REFERENCES]->(i:Issue)
    WHERE (doc:Page OR doc:Blogpost)
      AND NOT (i)<-[:REFERENCES]-(:Commit)
    RETURN p1
    LIMIT 100
tags:
- table
- graph
