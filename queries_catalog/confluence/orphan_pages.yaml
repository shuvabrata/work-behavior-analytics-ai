name: Orphan Pages
description: |-
  **What it is:** Identifies isolated Confluence pages that lack both parent and child page relationships.
  
  **How it helps:** Acts as a data quality sweep for Knowledge Managers to find unindexed "floating" pages that need to be organized into the proper space hierarchy.
  
  **What-If Impact:** Orphaned pages are practically unfindable through organic navigation, meaning the effort spent writing them is largely wasted.
summary: "Pages with no parent or child pages."
default_view: tabular
owner: confluence-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Page)
    WHERE NOT (p)-[:PARENT_OF]->(:Page)
      AND NOT (p)<-[:PARENT_OF]-(:Page)
    RETURN p.title as page_title,
           p.status as status,
           p.last_updated_at as last_updated_at
    ORDER BY last_updated_at DESC, page_title
    LIMIT 100
  graph: |-
    MATCH p1=(p:Page)
    WHERE NOT (p)-[:PARENT_OF]->(:Page)
      AND NOT (p)<-[:PARENT_OF]-(:Page)
    RETURN p1
    LIMIT 100
tags:
- table
- graph
