name: Page Edit Churn Hotspots
description: |-
  **What it is:** Identifies wiki pages experiencing the highest frequency of version updates and text churn.
  
  **How it helps:** Serves as a volatility indicator for Tech Leads, pointing to requirements or specs that are fluctuating wildly during a sprint.
  
  **What-If Impact:** Uncontrolled edit churn on a spec document while development is underway virtually guarantees that engineers will build the wrong thing or face constant rework.
summary: "Identify pages with the highest version churn and latest updates."
default_view: tabular
owner: confluence-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Page)
    RETURN p.title as page_title,
           p.version as version,
           p.status as status,
           p.last_updated_at as last_updated_at
    ORDER BY coalesce(p.version, 0) DESC, p.last_updated_at DESC, p.title
    LIMIT 100
  graph: |-
    MATCH p1=(editor:Person)-[:MODIFIED]->(p:Page)
    RETURN p1
    LIMIT 100
tags:
- table
- graph
