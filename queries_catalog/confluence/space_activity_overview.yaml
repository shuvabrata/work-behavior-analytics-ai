name: Space Activity Overview
description: |-
  **What it is:** Counts the total number of pages and blogposts created within each Confluence space.
  
  **How it helps:** Helps Administrators assess knowledge base adoption and identify which business units or teams are actively maintaining their documentation portals.
  
  **What-If Impact:** Low activity in core spaces suggests a shadow documentation culture (e.g., hoarding knowledge in private docs or chats) which hurts cross-functional transparency.
summary: "Counts pages and blogposts by Confluence space."
default_view: tabular
owner: confluence-analytics
status: draft
queries:
  tabular: |-
    MATCH (s:Space)<-[:IN_SPACE]-(doc)
    WHERE doc:Page OR doc:Blogpost
    RETURN s.key as space_key,
           s.name as space_name,
           count(DISTINCT doc) as document_count,
           collect(DISTINCT doc.title)[0..10] as sample_documents
    ORDER BY document_count DESC, s.key
    LIMIT 100
  graph: |-
    MATCH p1=(s:Space)<-[:IN_SPACE]-(doc)
    WHERE doc:Page OR doc:Blogpost
    RETURN p1
    LIMIT 100
tags:
- table
- graph
