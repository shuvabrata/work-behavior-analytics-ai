name: Code Changes Without Doc Update
description: |-
  **What it is:** Identifies code commits linked to Jira issues that completely lack any corresponding Confluence documentation references.
  
  **How it helps:** Acts as a compliance guardrail for Tech Leads to ensure that significant codebase changes are accompanied by updated technical specs or release notes.
  
  **What-If Impact:** Shipping undocumented code gradually decays the accuracy of the organizational knowledge base, making future onboarding and incident response increasingly difficult.
summary: "Commits linked to issues that have no Confluence references."
default_view: tabular
owner: cross-domain-analytics
status: draft
queries:
  tabular: |-
    MATCH (c:Commit)-[:REFERENCES]->(i:Issue)
    WHERE NOT (i)<-[:REFERENCES]-(:Page)
      AND NOT (i)<-[:REFERENCES]-(:Blogpost)
    RETURN i.key as issue_key,
           i.summary as summary,
           count(DISTINCT c) as commit_count,
           collect(DISTINCT c.sha)[0..10] as sample_commits
    ORDER BY commit_count DESC, issue_key
    LIMIT 100
  graph: |-
    MATCH p1=(c:Commit)-[:REFERENCES]->(i:Issue)
    WHERE NOT (i)<-[:REFERENCES]-(:Page)
      AND NOT (i)<-[:REFERENCES]-(:Blogpost)
    RETURN p1
    LIMIT 100
tags:
- table
- graph
