name: Developer Impact Analysis
description: |-
  **What it is:** Aggregates a single developer's activity footprint across Jira (issues completed), GitHub (commits, PRs, reviews), and Confluence (pages edited).
  
  **How it helps:** Provides Engineering Managers with a holistic view of an engineer's contributions, capturing not just code output but also planning and documentation efforts.
  
  **What-If Impact:** Evaluating engineers based on a single domain (like commit count) actively penalizes the collaborative "glue" work necessary for team success.
summary: "Developer contributions across all domains."
default_view: tabular
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (p:Person)
    CALL {
      WITH p
      OPTIONAL MATCH (p)<-[:CREATED_BY]-(pr:PullRequest)
      RETURN count(DISTINCT pr) AS pr_count
    }
    CALL {
      WITH p
      OPTIONAL MATCH (p)<-[:CREATED_BY]-(c:Commit)
      RETURN count(DISTINCT c) AS commit_count
    }
    CALL {
      WITH p
      OPTIONAL MATCH (p)-[:ASSIGNED_TO]-(i:Issue)
      RETURN count(DISTINCT i) AS issue_count
    }
    RETURN p.name AS developer,
           p.title,
           pr_count AS prs,
           commit_count AS commits,
           issue_count AS issues
    ORDER BY commits DESC
    LIMIT 100
  graph: |-
    MATCH p1=(p:Person)
        OPTIONAL MATCH p2=(p)<-[:CREATED_BY]-(pr:PullRequest)
        OPTIONAL MATCH p3=(p)<-[:CREATED_BY]-(c:Commit)
        OPTIONAL MATCH p4=(p)-[:ASSIGNED_TO]-(i:Issue)
        RETURN p1, p2, p3, p4
        LIMIT 100
tags:
- table
- graph
