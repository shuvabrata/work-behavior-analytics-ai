name: End-to-End Traceability
description: |-
  **What it is:** Traces the complete lifecycle of a high-level Initiative all the way down through Epics, Issues, Commits, and Pull Requests.
  
  **How it helps:** Acts as the ultimate traceability report for PMOs and Directors to verify that top-level strategic bets are actually translating into shipped code.
  
  **What-If Impact:** Without full end-to-end traceability, leadership is forced to rely on anecdotal updates rather than verifiable data to know if an Initiative is actually being worked on.
summary: "Complete Initiative \u2192 Epic \u2192 Issue \u2192 Commit \u2192 PR chain."
default_view: tabular
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (init:Initiative)<-[:PART_OF]-(e:Epic)<-[:PART_OF]-(i:Issue)
        MATCH (i)<-[:REFERENCES]-(c:Commit)<-[:INCLUDES]-(pr:PullRequest)
        RETURN init.key as initiative, e.key as epic, i.key as issue,
               c.sha as commit_sha, pr.number as pr_number
        LIMIT 100
  graph: |-
    MATCH p1=(init:Initiative)<-[:PART_OF]-(e:Epic)<-[:PART_OF]-(i:Issue)
        MATCH p2=(i)<-[:REFERENCES]-(c:Commit)<-[:INCLUDES]-(pr:PullRequest)
        RETURN p1, p2
        LIMIT 100
tags:
- table
- graph
