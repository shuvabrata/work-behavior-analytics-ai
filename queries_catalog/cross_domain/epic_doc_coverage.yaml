name: Epic Doc Coverage
description: |-
  **What it is:** Calculates the percentage of issues within an Epic that are explicitly linked to Confluence requirement or design pages.
  
  **How it helps:** Enables Program Managers to verify that large-scale initiatives are grounded in written specifications rather than just oral agreements.
  
  **What-If Impact:** Low documentation coverage on major Epics usually precedes severe scope creep, as undocumented assumptions lead to misaligned development efforts.
summary: "Measure documentation coverage for epics through their issues."
default_view: tabular
owner: cross-domain-analytics
status: draft
queries:
  tabular: |-
    MATCH (e:Epic)<-[:PART_OF]-(i:Issue)
    OPTIONAL MATCH (doc)-[:REFERENCES]->(i)
    WHERE doc:Page OR doc:Blogpost
    WITH e,
         count(DISTINCT i) AS issue_count,
         count(DISTINCT doc) AS doc_count,
         collect(DISTINCT doc.title)[0..10] AS sample_docs
    RETURN e.key AS epic_key,
           e.summary AS epic_summary,
           issue_count,
           doc_count,
           sample_docs
    ORDER BY doc_count DESC, issue_count DESC, epic_key
    LIMIT 100
  graph: |-
    MATCH p1=(e:Epic)<-[:PART_OF]-(i:Issue)<-[:REFERENCES]-(doc)
    WHERE doc:Page OR doc:Blogpost
    RETURN p1
    LIMIT 100
tags:
- table
- graph
