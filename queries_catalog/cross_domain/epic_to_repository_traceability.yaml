name: Epic to Repository Traceability
description: |-
  **What it is:** Maps high-level Epics down to the specific GitHub repositories they modify, traced via the commits of their child issues.
  
  **How it helps:** Helps System Architects understand the true architectural blast radius of a business initiative across various microservices and monolithic codebases.
  
  **What-If Impact:** Without repository traceability, teams often underestimate deployment complexity, leading to missed cross-service coordinate releases and broken integrations.
summary: "Map epics to repositories via commits."
default_view: tabular
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (e:Epic)<-[:PART_OF]-(i:Issue)<-[:REFERENCES]-(c:Commit)
        MATCH (c)-[:PART_OF]->(b:Branch)-[:BRANCH_OF]-(r:Repository)
        RETURN e.key as epic, e.summary,
               collect(DISTINCT r.name) as repositories,
               count(DISTINCT c) as commits
        ORDER BY commits DESC
        LIMIT 100
  graph: |-
    MATCH p1=(e:Epic)<-[:PART_OF]-(i:Issue)<-[:REFERENCES]-(c:Commit)
        MATCH p2=(c)-[:PART_OF]->(b:Branch)-[:BRANCH_OF]-(r:Repository)
        RETURN p1, p2
        LIMIT 100
tags:
- table
- graph
