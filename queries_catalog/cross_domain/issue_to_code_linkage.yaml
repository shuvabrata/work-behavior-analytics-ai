name: Issue to Code Linkage
description: |-
  **What it is:** Identifies individual Jira issues that have successfully been linked to specific GitHub code commits.
  
  **How it helps:** Serves as the primary traceability query for Scrum Masters to verify that developers are properly tagging their commits with ticket numbers.
  
  **What-If Impact:** Poor issue-to-code linkage completely breaks CI/CD release automation that relies on ticket statuses to generate automated changelogs and compliance reports.
summary: "Issues linked to actual code commits."
default_view: tabular
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)<-[:REFERENCES]-(c:Commit)
        RETURN i.key, i.type, i.summary,
               count(c) as commit_count
        ORDER BY commit_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)<-[:REFERENCES]-(c:Commit)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
