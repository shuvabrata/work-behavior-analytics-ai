name: Jira Issues Without Docs
description: |-
  **What it is:** Identifies Jira issues that have no associated Confluence documentation attached.
  
  **How it helps:** Serves as a compliance check for Tech Leads to ensure that significant technical decisions are documented before a ticket is closed.
  
  **What-If Impact:** Closing major work items without documentation guarantees that future maintainers will have to reverse-engineer the "why" behind technical decisions.
summary: "Jira issues that do not have a Confluence reference."
default_view: tabular
owner: cross-domain-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)
    WHERE NOT (i)<-[:REFERENCES]-(:Page)
      AND NOT (i)<-[:REFERENCES]-(:Blogpost)
    RETURN i.key as issue_key,
           i.summary as summary,
           i.status as status,
           i.priority as priority
    ORDER BY i.priority DESC, i.key
    LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)
    WHERE NOT (i)<-[:REFERENCES]-(:Page)
      AND NOT (i)<-[:REFERENCES]-(:Blogpost)
    RETURN p1
    LIMIT 100
tags:
- table
- graph
