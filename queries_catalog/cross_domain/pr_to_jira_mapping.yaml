name: PR to Jira Mapping
description: |-
  **What it is:** Establishes a direct link between GitHub Pull Requests and Jira issues by analyzing commit metadata.
  
  **How it helps:** Helps QA Engineers understand exactly which code changes they are testing when verifying a specific Jira ticket in staging.
  
  **What-If Impact:** Without PR-to-Jira mapping, QA must guess the scope of changes, leading to insufficient testing of edge cases and unverified deployments.
summary: "PRs linked to Jira issues via commits."
default_view: tabular
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:INCLUDES]->(c:Commit)-[:REFERENCES]->(i:Issue)
        RETURN pr.number as pr_number, pr.title,
               collect(DISTINCT i.key) as jira_issues,
               size(collect(DISTINCT i.key)) as issue_count
        ORDER BY issue_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)-[:INCLUDES]->(c:Commit)-[:REFERENCES]->(i:Issue)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
