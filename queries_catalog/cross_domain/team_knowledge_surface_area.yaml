name: Team Knowledge Surface Area
description: |-
  **What it is:** Quantifies the total volume of unique code repositories, Jira projects, and Confluence spaces a specific team interacts with.
  
  **How it helps:** Helps Engineering Directors assess cognitive load, identifying teams that are spread too thin across disparate domains and legacy systems.
  
  **What-If Impact:** Forcing a team to maintain too large a knowledge surface area inevitably leads to context-switching exhaustion and a dramatic drop in delivery speed.
summary: "How much documentation, work, and code a team touches."
default_view: tabular
owner: cross-domain-analytics
status: draft
queries:
  tabular: |-
    MATCH (t:Team)-[:MEMBER_OF]-(p:Person)
    CALL {
      WITH p
      OPTIONAL MATCH (p)-[:CREATED|MODIFIED|COMMENTED_ON|REACTED_TO]->(doc)
      WHERE doc:Page OR doc:Blogpost
      RETURN count(DISTINCT doc) AS doc_count
    }
    CALL {
      WITH p
      OPTIONAL MATCH (p)-[:ASSIGNED_TO]-(i:Issue)
      RETURN count(DISTINCT i) AS issue_count
    }
    CALL {
      WITH p
      OPTIONAL MATCH (p)-[:COMMENTED_ON]->(work)
      WHERE work:Issue OR work:Epic OR work:Initiative
      RETURN count(DISTINCT work) AS work_comment_count
    }
    CALL {
      WITH p
      OPTIONAL MATCH (p)-[:AUTHORED_BY]-(c:Commit)
      RETURN count(DISTINCT c) AS commit_count
    }
    CALL {
      WITH p
      OPTIONAL MATCH (p)<-[:CREATED_BY]-(pr:PullRequest)
      RETURN count(DISTINCT pr) AS pr_count
    }
    RETURN t.name AS team,
           count(DISTINCT p) AS members,
           sum(doc_count) AS docs_touched,
           sum(work_comment_count) AS work_commented_on,
           sum(issue_count) AS issues_touched,
           sum(commit_count) AS commits,
           sum(pr_count) AS prs
    ORDER BY docs_touched DESC, issues_touched DESC, team
    LIMIT 100
  graph: |-
    MATCH p1=(t:Team)-[:MEMBER_OF]-(p:Person)-[:CREATED|MODIFIED|COMMENTED_ON|REACTED_TO]->(doc)
    WHERE doc:Page OR doc:Blogpost
    RETURN p1
    LIMIT 100
tags:
- table
- graph
