name: Team Workload Overview
description: |-
  **What it is:** Aggregates a team's total in-progress workload spanning both Jira issues and open GitHub pull requests.
  
  **How it helps:** Gives Engineering Managers a complete, multi-system view of team utilization, preventing burnout caused by hidden code-review or maintenance work not tracked in Jira.
  
  **What-If Impact:** Assessing capacity solely via Jira story points misses the substantial effort spent on unplanned bug fixes, reviews, and infrastructure work in GitHub.
summary: "Team workload across GitHub and Jira."
default_view: graph
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (t:Team)-[:MEMBER_OF]-(p:Person)
        OPTIONAL MATCH (p)-[:ASSIGNED_TO]-(i:Issue)
        OPTIONAL MATCH (p)-[:AUTHORED_BY]-(c:Commit)
        RETURN t.name as team,
               count(DISTINCT p) as members,
               count(DISTINCT i) as assigned_issues,
               count(DISTINCT c) as commits
        ORDER BY assigned_issues DESC
        LIMIT 100
  graph: |-
    MATCH path=(t:Team)-[:MEMBER_OF]-(p:Person)-[:ASSIGNED_TO]-(i:Issue)
        RETURN path
        LIMIT 50
    UNION
    MATCH path=(t:Team)-[:MEMBER_OF]-(p:Person)-[:AUTHORED_BY]-(c:Commit)
        RETURN path
        LIMIT 50
tags:
- table
- graph
