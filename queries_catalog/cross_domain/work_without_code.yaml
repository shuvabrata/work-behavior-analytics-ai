name: Work Without Code
description: |-
  **What it is:** Flags Jira issues transitioned to 'Done' status that possess absolutely no associated code commits or pull requests.
  
  **How it helps:** Acts as a data quality and process check for Agile Coaches to detect "ghost tickets" or manual, untracked out-of-band changes to production.
  
  **What-If Impact:** A high volume of code-less 'Done' tickets obscures true engineering velocity and suggests that operational work or manual interventions are bypassing version control.
summary: "Issues marked Done but no code commits - Data Quality check."
default_view: tabular
owner: data-platform
status: draft
queries:
  tabular: |-
    MATCH (i:Issue {status: 'Done'})
        WHERE NOT (i)<-[:REFERENCES]-(:Commit)
        RETURN i.key, i.type, i.summary, i.status
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue {status: 'Done'})
        WHERE NOT (i)<-[:REFERENCES]-(:Commit)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
