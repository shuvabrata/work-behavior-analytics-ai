name: Code Churn
description: |-
  **What it is:** Identifies files experiencing the highest absolute volume of code additions and deletions.
  
  **How it helps:** Acts as an architectural early warning system for Tech Leads, pointing to volatile files that may be violating the Single Responsibility Principle.
  
  **What-If Impact:** Ignoring extreme code churn often leads to "god classes" or fragile modules where even minor changes introduce unpredictable side-effects.
summary: "Files with most changes (additions + deletions)."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (f:File)<-[m:MODIFIES]-(c:Commit)
        RETURN f.path as file, f.language as language,
               sum(m.additions) as total_additions,
               sum(m.deletions) as total_deletions,
               sum(m.additions + m.deletions) as total_churn,
               count(c) as num_commits
        ORDER BY total_churn DESC
        LIMIT 100
  graph: |-
    MATCH p1=(f:File)<-[m:MODIFIES]-(c:Commit)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
