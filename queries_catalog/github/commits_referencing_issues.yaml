name: Commits Referencing Issues
description: |-
  **What it is:** Aggregates commits that explicitly mention Jira issue keys in their commit messages, grouped by issue type.
  
  **How it helps:** Allows Engineering Managers to verify traceability discipline, ensuring code changes are properly linked to planned work items or defect reports.
  
  **What-If Impact:** A low rate of issue-referencing commits breaks end-to-end delivery tracking, making it impossible to audit why certain code was introduced or modified.
summary: "Commits referencing Jira issues by issue type."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (c:Commit)-[:REFERENCES]->(i:Issue)
        RETURN i.key as issue, i.type as type, count(c) as commits
        ORDER BY commits DESC
        LIMIT 100
  graph: |-
    MATCH p1=(c:Commit)-[:REFERENCES]->(i:Issue)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
