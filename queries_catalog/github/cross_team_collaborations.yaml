name: Cross-Team Collaborations
description: |-
  **What it is:** Maps organizational teams to the repositories where they have been granted READ access to contribute or review code.
  
  **How it helps:** Enables Program Managers to track internal open-source initiatives (InnerSource) and monitor which teams are actively sharing code assets.
  
  **What-If Impact:** Lacking visibility into cross-team code access makes it difficult to audit intellectual property exposure or encourage InnerSource reuse.
summary: "Teams with READ access to repositories."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (t:Team)-[c:COLLABORATOR {permission: 'READ'}]-(r:Repository)
        RETURN r.name, collect(t.name) as read_access_teams
        ORDER BY r.name
        LIMIT 100
  graph: |-
    MATCH p1=(t:Team)-[c:COLLABORATOR {permission: 'READ'}]-(r:Repository)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
