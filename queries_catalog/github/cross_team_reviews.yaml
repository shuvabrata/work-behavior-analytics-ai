name: Cross-Team Reviews
description: |-
  **What it is:** Highlights instances where a developer from one team reviews code authored by a developer on a different team.
  
  **How it helps:** Helps Engineering Directors track cross-pollination of knowledge and identify whether architectural standards are being shared across organizational silos.
  
  **What-If Impact:** A complete absence of cross-team reviews often signals deep organizational silos, resulting in duplicated effort and inconsistent codebase standards.
summary: "Cross-team code review collaboration."
default_view: graph
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:CREATED_BY]->(author:Person)-[:MEMBER_OF]-(author_team:Team)
        MATCH (pr)-[:REVIEWED_BY]->(reviewer:Person)-[:MEMBER_OF]-(reviewer_team:Team)
        WHERE author_team <> reviewer_team
        RETURN author_team.name as author_team,
               reviewer_team.name as reviewer_team,
               count(pr) as cross_team_reviews
        ORDER BY cross_team_reviews DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)-[:CREATED_BY]->(author:Person)-[:MEMBER_OF]-(author_team:Team)
        MATCH p2=(pr)-[:REVIEWED_BY]->(reviewer:Person)-[:MEMBER_OF]-(reviewer_team:Team)
        WHERE author_team <> reviewer_team
        RETURN p1, p2
        LIMIT 100
tags:
- table
- graph
