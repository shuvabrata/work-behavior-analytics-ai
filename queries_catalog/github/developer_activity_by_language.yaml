name: Developer Activity by Language
description: |-
  **What it is:** Aggregates developer commits based on the programming language of the modified files.
  
  **How it helps:** Allows Technical Management to understand the actual technology footprint of the organization, aiding in targeted hiring and training initiatives.
  
  **What-If Impact:** Misunderstanding the team's true language distribution can lead to adopting frameworks or architectures that the current engineering staff is unequipped to support.
summary: "Developer activity by programming language."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Person)-[:AUTHORED_BY]-(c:Commit)-[:MODIFIES]->(f:File)
        RETURN p.name as developer, f.language as language,
               count(DISTINCT c) as commits, count(f) as files_touched
        ORDER BY commits DESC
        LIMIT 100
  graph: |-
    MATCH p1=(p:Person)-[:AUTHORED_BY]-(c:Commit)-[:MODIFIES]->(f:File)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
