name: File Bus Factor Hotspots
description: |-
  **What it is:** Surfaces highly modified files that are authored or edited by only one or two specific developers.
  
  **How it helps:** Serves as a critical risk alert for Tech Leads to identify localized knowledge silos and enforce mandatory code walkthroughs for those components.
  
  **What-If Impact:** Allowing a "bus factor of 1" on heavily modified core files virtually guarantees massive delivery delays if that specific developer takes leave or departs.
summary: "Files with high churn but low author diversity."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (f:File)<-[:MODIFIES]-(c:Commit)-[:AUTHORED_BY]->(p:Person)
        WITH f,
             count(DISTINCT c) as commit_count,
             count(DISTINCT p) as author_count,
             sum(coalesce(c.additions, 0) + coalesce(c.deletions, 0)) as churn
        RETURN f.repo_name as repository,
               f.path as path,
               f.language as language,
               commit_count,
               author_count,
               churn,
               round(churn * 1.0 / (author_count + 1), 1) as churn_per_author
        ORDER BY author_count ASC, churn DESC
        LIMIT 100
  graph: |-
    MATCH p1=(f:File)<-[:MODIFIES]-(c:Commit)-[:AUTHORED_BY]->(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph

