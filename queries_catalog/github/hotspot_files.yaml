name: Hotspot Files
description: |-
  **What it is:** Highlights the source code files that are modified most frequently across the entire repository.
  
  **How it helps:** Directs Tech Leads to potential design flaws or heavily overloaded modules that require architectural decoupling.
  
  **What-If Impact:** Persistently high modification rates on a single file often correlate directly with elevated defect density and fragile, tightly coupled logic.
summary: "Files with most modifications."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (f:File)<-[:MODIFIES]-(c:Commit)
        RETURN f.path as path, f.language as lang, count(c) as modifications
        ORDER BY modifications DESC
        LIMIT 100
  graph: |-
    MATCH p1=(f:File)<-[:MODIFIES]-(c:Commit)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
