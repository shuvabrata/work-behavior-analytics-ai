name: Issue Age by Repository
description: |-
  **What it is:** Measures how long open GitHub issues have been open across repositories, calculating average age and identifying the oldest unresolved issues.

  **How it helps:** Surfaces neglected repositories where issues are left open indefinitely without resolution, enabling Tech Leads to triage and close stale issues.

  **What-If Impact:** Allowing issues to age unchecked inflates the backlog, obscures active work tracking, and creates a misleading picture of team capacity.
summary: "Age of open GitHub issues by repository."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)-[:PART_OF]->(r:Repository)
        WHERE i.id STARTS WITH 'github::Issue::' AND i.status = 'open'
        WITH r, i,
             duration.between(date(i.created_at), date()).days as age_days
        RETURN r.name as repository,
               count(i) as open_issues,
               round(avg(age_days), 1) as avg_age_days,
               max(age_days) as oldest_issue_days,
               collect(i.key)[0..5] as oldest_issue_keys
        ORDER BY avg_age_days DESC
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)-[:PART_OF]->(r:Repository)
        WHERE i.id STARTS WITH 'github::Issue::' AND i.status = 'open'
        RETURN p1
        LIMIT 100
tags:
- table
- graph