name: Issues by Label
description: |-
  **What it is:** Aggregates GitHub issues by label, showing how many issues carry each label across all repositories.

  **How it helps:** Allows Tech Leads and Program Managers to understand the distribution of issue categories — bugs, enhancements, tech debt, help wanted — across the organization's GitHub repositories.

  **What-If Impact:** Without label visibility, teams lack a structured way to prioritize and triage issues, leading to ad-hoc handling of critical bug reports.
summary: "GitHub issues grouped by label."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)
        WHERE i.id STARTS WITH 'github::Issue::'
        UNWIND i.labels as label
        RETURN label,
               count(i) as issue_count
        ORDER BY issue_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)
        WHERE i.id STARTS WITH 'github::Issue::'
        RETURN p1
        LIMIT 100
tags:
- table
- graph