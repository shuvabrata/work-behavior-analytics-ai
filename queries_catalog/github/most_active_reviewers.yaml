name: Most Active Reviewers
description: |-
  **What it is:** Ranks developers based on the total number of code reviews they have formally submitted.
  
  **How it helps:** Helps Tech Leads recognize engineers who bear the heavy, often invisible burden of maintaining codebase quality through peer review.
  
  **What-If Impact:** Failing to recognize and reward top reviewers often leads to review burnout and a rapid decline in overall code quality as reviewers disengage.
summary: "Most active code reviewers."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:REVIEWED_BY]->(p:Person)
        RETURN p.name as reviewer,
               p.title as title,
               count(pr) as reviews_given,
               sum(CASE WHEN pr.state = 'merged' THEN 1 ELSE 0 END) as reviewed_and_merged
        ORDER BY reviews_given DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)-[:REVIEWED_BY]->(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
