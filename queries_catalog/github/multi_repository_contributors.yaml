name: Multi-Repository Contributors
description: |-
  **What it is:** Highlights developers who actively commit code to multiple distinct repositories.
  
  **How it helps:** Allows Management to identify potential "glue" engineers and architects whose cross-boundary work is critical to system integration.
  
  **What-If Impact:** Failing to recognize multi-repo contributors often means their high context-switching overhead is penalized in naive metric systems rather than rewarded for driving integration.
summary: "People working across multiple repos."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Person)-[c:COLLABORATOR]-(r:Repository)
        WITH p, c.permission as perm, collect(r.name) as repos
        WHERE size(repos) > 1
        RETURN p.name, p.title, perm, repos, size(repos) as repo_count
        ORDER BY repo_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(p:Person)-[c:COLLABORATOR]-(r:Repository)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
