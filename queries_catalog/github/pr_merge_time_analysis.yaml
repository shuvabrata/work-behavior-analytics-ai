name: PR Merge Time Analysis
description: |-
  **What it is:** Calculates the average lifecycle duration (time to merge) for Pull Requests.
  
  **How it helps:** Helps Engineering Managers assess CI/CD pipeline efficiency and review culture, indicating how quickly code travels from developer machine to main branch.
  
  **What-If Impact:** Slow PR merge times create integration bottlenecks and increase the likelihood of massive merge conflicts that stall entire release cycles.
summary: "Average time to merge PRs."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)
        WHERE pr.state = 'merged' AND pr.merged_at IS NOT NULL
        WITH pr, duration.between(pr.created_at, pr.merged_at) as merge_duration
        RETURN avg(merge_duration.days) as avg_days_to_merge,
               min(merge_duration.days) as min_days,
               max(merge_duration.days) as max_days
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)
        WHERE pr.state = 'merged' AND pr.merged_at IS NOT NULL
        RETURN p1
        LIMIT 100
tags:
- table
- graph
