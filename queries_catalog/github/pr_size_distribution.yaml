name: PR Size Distribution
description: |-
  **What it is:** Categorizes Pull Requests by their sheer size, measured by the number of commits or changed lines.
  
  **How it helps:** Helps Scrum Masters and Tech Leads verify whether the team is adhering to the agile practice of delivering small, incremental changes.
  
  **What-If Impact:** A high frequency of massively sized PRs overwhelms reviewers, leading to rubber-stamp approvals and an increased likelihood of uncaught bugs.
summary: "PR size distribution by commit count."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)
        WITH pr,
             CASE
               WHEN pr.commits_count <= 3 THEN 'Small (1-3 commits)'
               WHEN pr.commits_count <= 8 THEN 'Medium (4-8 commits)'
               ELSE 'Large (9+ commits)'
             END as size_category
        RETURN size_category, count(pr) as pr_count
        ORDER BY pr_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
