name: PR Velocity by Repository
description: |-
  **What it is:** Measures the throughput and merge rate of Pull Requests across different repositories.
  
  **How it helps:** Provides Program Managers with an objective metric to gauge team delivery speed and compare operational efficiency across different services.
  
  **What-If Impact:** Ignoring repository-level velocity makes it difficult to detect when specific services become bottlenecked by legacy code or insufficient tooling.
summary: "PR velocity and merge rate by repository."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:TARGETS]->(b:Branch)-[:BRANCH_OF]-(r:Repository)
        RETURN r.name as repository,
               count(pr) as total_prs,
               sum(CASE WHEN pr.state = 'merged' THEN 1 ELSE 0 END) as merged,
               sum(CASE WHEN pr.state = 'open' THEN 1 ELSE 0 END) as open,
               round(sum(CASE WHEN pr.state = 'merged' THEN 1 ELSE 0 END) * 100.0 / count(pr), 1) as merge_rate
        ORDER BY total_prs DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)-[:TARGETS]->(b:Branch)-[:BRANCH_OF]-(r:Repository)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
