name: PRs Without Reviews
description: |-
  **What it is:** Identifies Pull Requests that were merged without any peer review comments or formal approvals.
  
  **How it helps:** Acts as a crucial data quality and compliance check for Engineering Directors to ensure mandatory review policies are not being circumvented.
  
  **What-If Impact:** Bypassing peer review increases the risk of production outages and violates standard SOC2 compliance requirements for code deployment.
summary: "PRs without reviews - Data Quality check."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)
        WHERE NOT (pr)-[:REVIEWED_BY]->()
        RETURN pr.number, pr.title, pr.state, pr.created_at
        ORDER BY pr.created_at DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)
        WHERE NOT (pr)-[:REVIEWED_BY]->()
        RETURN p1
        LIMIT 100
tags:
- table
- graph
