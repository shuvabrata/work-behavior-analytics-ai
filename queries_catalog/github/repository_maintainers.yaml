name: Repository Maintainers
description: |-
  **What it is:** Identifies individuals who possess elevated WRITE or maintainer access privileges across specific repositories.
  
  **How it helps:** Acts as a vital security and compliance check for Engineering Directors to audit access control and ensure least-privilege principles are enforced.
  
  **What-If Impact:** Over-provisioning WRITE access increases the risk of accidental main branch overwrites and severe security compromises through hijacked accounts.
summary: "Find maintainers (people with WRITE access)."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Person)-[c:COLLABORATOR {permission: 'WRITE'}]-(r:Repository)
        RETURN r.name, collect(p.name) as maintainers
        ORDER BY r.name
        LIMIT 100
  graph: |-
    MATCH p1=(p:Person)-[c:COLLABORATOR {permission: 'WRITE'}]-(r:Repository)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
