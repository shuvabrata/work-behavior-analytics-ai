name: Review Bottlenecks
description: |-
  **What it is:** Identifies Pull Requests that have outstanding review requests which have not yet been completed.
  
  **How it helps:** Enables Tech Leads to actively unblock in-flight work by pinging assigned reviewers or reassigning reviews to available engineers.
  
  **What-If Impact:** Stagnant code reviews artificially inflate lead times and increase merge conflicts as the underlying main branch drifts further away.
summary: "Review requests not yet completed - Data Quality check."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:REQUESTED_REVIEWER]->(p:Person)
        WHERE NOT (pr)-[:REVIEWED_BY]->(p)
        WITH p, count(pr) as pending_reviews
        RETURN p.name as reviewer, pending_reviews
        ORDER BY pending_reviews DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)-[:REQUESTED_REVIEWER]->(p:Person)
        WHERE NOT (pr)-[:REVIEWED_BY]->(p)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
