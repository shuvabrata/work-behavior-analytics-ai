name: Test vs Production Code
description: |-
  **What it is:** Compares the volume of code modifications made in test files versus production files.
  
  **How it helps:** Enables Tech Leads and QA to verify if new feature development is being adequately matched with corresponding automated test updates.
  
  **What-If Impact:** A high ratio of production code churn with zero test updates indicates growing technical debt and a high risk of regression bugs in upcoming releases.
summary: "Test vs production code analysis."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (f:File)<-[:MODIFIES]-(c:Commit)
        WITH f.is_test as is_test,
             count(DISTINCT f) as file_count,
             count(c) as commit_count
        RETURN CASE WHEN is_test THEN 'Test Files' ELSE 'Production Files' END as type,
               file_count, commit_count
        LIMIT 100
  graph: |-
    MATCH p1=(f:File)<-[:MODIFIES]-(c:Commit)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
