name: Top Contributors
description: |-
  **What it is:** Identifies the top engineers based purely on total commit count.
  
  **How it helps:** Gives Management a rudimentary pulse on raw developer output, though primarily useful as a baseline rather than a direct performance metric.
  
  **What-If Impact:** Using commit counts alone to judge performance incentivizes trivial code changes while penalizing engineers who focus on complex, high-value problem solving.
summary: "Top 10 contributors by commit count."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Person)-[:AUTHORED_BY]-(c:Commit)
        RETURN p.name as name, p.title as title, count(c) as commits
        ORDER BY commits DESC
        LIMIT 100
  graph: |-
    MATCH p1=(p:Person)-[:AUTHORED_BY]-(c:Commit)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
