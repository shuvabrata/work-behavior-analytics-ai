name: Top PR Contributors
description: |-
  **What it is:** Ranks individual developers by the sheer volume of Pull Requests they have authored and opened.
  
  **How it helps:** Provides a high-level view of throughput for Tech Leads, highlighting highly prolific engineers or potential automated bot accounts.
  
  **What-If Impact:** Focusing solely on PR volume without context can inadvertently incentivize breaking single logical changes into artificially small PRs to game the metrics.
summary: "Top PR contributors by creation count."
default_view: tabular
owner: github-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:CREATED_BY]->(p:Person)
        RETURN p.name as developer,
               p.title as title,
               count(pr) as prs_created,
               sum(CASE WHEN pr.state = 'merged' THEN 1 ELSE 0 END) as merged,
               sum(pr.additions) as total_additions,
               sum(pr.deletions) as total_deletions
        ORDER BY prs_created DESC
        LIMIT 100
  graph: |-
    MATCH p1=(pr:PullRequest)-[:CREATED_BY]->(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
