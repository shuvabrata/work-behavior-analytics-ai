name: Top N Code Reviewer
description: |-
  **What it is:** Ranks developers based on the total number of code reviews they have formally submitted.

  **How it helps:** Helps Tech Leads recognise engineers who bear the heavy, often invisible burden of maintaining codebase quality through peer review.

  **What-If Impact:** Failing to recognise and reward top reviewers often leads to review burnout and a rapid decline in overall code quality as reviewers disengage.
summary: "Top 10 most active code reviewers."
default_view: tabular
owner: hall-of-fame-analytics
status: draft
queries:
  tabular: |-
    MATCH (pr:PullRequest)-[:REVIEWED_BY]->(p:Person)
    RETURN coalesce(p._display_name, p.name) AS reviewer,
           p.title AS title,
           count(pr) AS reviews_given,
           sum(CASE WHEN pr.state = 'merged' THEN 1 ELSE 0 END) AS reviewed_and_merged
    ORDER BY reviews_given DESC
    LIMIT 10
  graph: |-
    MATCH p1=(pr:PullRequest)-[:REVIEWED_BY]->(p:Person)
    RETURN p1
    LIMIT 100
tags:
- table
- graph
