name: Top N Jira Commenters
description: |-
  **What it is:** Ranks people by the total number of comments they have left on Jira Issues, Epics, and Initiatives. Uses the aggregated `count` property on `COMMENTED_ON` edges.

  **How it helps:** Comments represent active engagement — clarifying requirements, unblocking teammates, or raising concerns. High comment counts identify collaborative team members whose participation keeps work moving.

  **What-If Impact:** People who comment heavily are often informal glue for their teams. If they disengage, discussions stall and decision latency increases noticeably across the team.
summary: "Top 10 commenters on Jira issues, epics, and initiatives."
default_view: tabular
owner: hall-of-fame-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Person)-[r:COMMENTED_ON]->(entity)
    WHERE (entity:Issue OR entity:Epic OR entity:Initiative)
      AND entity.id STARTS WITH 'jira::'
    RETURN coalesce(p._display_name, p.name, p.id) AS commenter,
           count(DISTINCT entity) AS entities_commented_on,
           sum(r.count) AS total_comments
    ORDER BY total_comments DESC
    LIMIT 10
  graph: |-
    MATCH (p:Person)-[r:COMMENTED_ON]->(entity)
    WHERE (entity:Issue OR entity:Epic OR entity:Initiative)
      AND entity.id STARTS WITH 'jira::'
    WITH p, sum(r.count) AS total_comments
    ORDER BY total_comments DESC
    LIMIT 10
    MATCH p1=(p)-[r2:COMMENTED_ON]->(entity2)
    WHERE (entity2:Issue OR entity2:Epic OR entity2:Initiative)
      AND entity2.id STARTS WITH 'jira::'
    RETURN p1
tags:
- table
- graph
