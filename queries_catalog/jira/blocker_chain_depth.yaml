name: Blocker Chain Depth
description: |-
  **What it is:** Identifies issues linked in serial dependency chains up to 5 levels deep across Jira.
  
  **How it helps:** Assists Program Managers and Tech Leads in identifying compounding schedule risks and serial bottlenecks before critical milestones.
  
  **What-If Impact:** Allowing deep blocker chains to accumulate increases variance in delivery dates, whereas proactive restructuring of serial tasks into parallel work streams builds schedule buffer.
summary: "Issues with long blocker chains."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH p=(i:Issue)-[:BLOCKS*1..5]->(blocked:Issue)
        WITH i, max(length(p)) as max_chain_depth, count(DISTINCT blocked) as downstream_blocked_issues
        RETURN i.key as issue_key,
               i.summary as summary,
               i.priority as priority,
               i.status as status,
               max_chain_depth,
               downstream_blocked_issues
        ORDER BY max_chain_depth DESC, downstream_blocked_issues DESC
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)-[:BLOCKS*1..5]->(blocked:Issue)
        RETURN p1
        LIMIT 100
tags:
- table
- graph

