name: Bugs Related to Stories
description: |-
  **What it is:** Links bug-type issues directly to the specific user stories they relate to.
  
  **How it helps:** Enables QA/CE teams and Developers to trace defects back to their originating requirements, facilitating targeted root-cause analysis.
  
  **What-If Impact:** Without tracing bugs to specific stories, teams may treat defects in isolation rather than addressing systemic misunderstandings or gaps in specific feature requirements.
summary: "Bugs linked to specific stories."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (bug:Issue {type: 'Bug'})-[:RELATES_TO]-(story:Issue {type: 'Story'})
        RETURN bug.key, story.key as story, bug.summary
        LIMIT 100
  graph: |-
    MATCH p1=(bug:Issue {type: 'Bug'})-[:RELATES_TO]-(story:Issue {type: 'Story'})
        RETURN p1
        LIMIT 100
tags:
- table
- graph
