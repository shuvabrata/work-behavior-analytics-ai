name: Dependencies and Blockers
description: |-
  **What it is:** Highlights direct, single-level blocking relationships between individual issues.
  
  **How it helps:** Allows Program Managers to quickly pinpoint immediate workflow obstructions and prioritize unblocking activities for dependent teams.
  
  **What-If Impact:** Ignoring immediate blockers leads to developer idle time and localized delivery delays, which can quickly cascade to impact broader sprint goals.
summary: "Issues blocking other issues."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)-[:BLOCKS]->(blocked:Issue)
        RETURN i.key, i.summary,
               collect(blocked.key) as blocks_issues
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)-[:BLOCKS]->(blocked:Issue)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
