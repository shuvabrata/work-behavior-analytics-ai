name: Epic Ownership Distribution
description: |-
  **What it is:** Aggregates all Epics assigned to individual owners across the organization.
  
  **How it helps:** Allows Management to identify key personnel carrying a disproportionate share of major project leadership, aiding in capacity planning and delegation.
  
  **What-If Impact:** Failing to balance epic ownership can result in key-person bottlenecks and burnout, slowing down decision-making on critical initiatives.
summary: "Epic ownership by person."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (e:Epic)-[:ASSIGNED_TO]-(p:Person)
        RETURN p.name, p.role, count(e) as epic_count
        ORDER BY epic_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(e:Epic)-[:ASSIGNED_TO]-(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
