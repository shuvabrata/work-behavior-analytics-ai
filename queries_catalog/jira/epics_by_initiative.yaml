name: Epics by Initiative
description: |-
  **What it is:** Groups all Epics under their parent strategic Initiatives.
  
  **How it helps:** Helps Senior Executives track how high-level strategic goals are being decomposed into actionable project phases (Epics) across the organization.
  
  **What-If Impact:** Lacking visibility into this hierarchy makes it difficult to ensure that all ongoing tactical work rolls up to funded business objectives.
summary: "Epics grouped by initiative."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (e:Epic)-[:PART_OF]->(i:Initiative)
        RETURN i.key, i.summary, collect(e.key) as epics
        ORDER BY i.key
        LIMIT 100
  graph: |-
    MATCH p1=(e:Epic)-[:PART_OF]->(i:Initiative)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
