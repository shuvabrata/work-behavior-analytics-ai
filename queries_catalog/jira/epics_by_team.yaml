name: Epics by Team
description: |-
  **What it is:** Groups and counts the total number of Epics assigned to each organizational team.
  
  **How it helps:** Allows Management to evaluate the distribution of large-scale project responsibilities across different teams to guide headcount or restructuring decisions.
  
  **What-If Impact:** Ignoring team-level epic distribution can cause certain scrum teams to be chronically overburdened with context-switching across multiple large projects.
summary: "Epics assigned to each team."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (e:Epic)-[:TEAM]-(t:Team)
        RETURN t.name, count(e) as epic_count, collect(e.key) as epics
        ORDER BY epic_count DESC
        LIMIT 100
  graph: |-
    MATCH p1=(e:Epic)-[:TEAM]-(t:Team)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
