name: Epics with Owners and Teams
description: |-
  **What it is:** Maps Epics to both their individual owners and their executing teams, while tracing them back to parent Initiatives.
  
  **How it helps:** Gives Program Managers a holistic view of accountability, showing exactly who is leading the work and which team is executing it for a given strategic goal.
  
  **What-If Impact:** Without clear mapping of both owner and team, accountability becomes diffused, making it harder to coordinate status updates or resolve delivery escalations.
summary: "Complete epic context with owners, teams, and initiatives."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (e:Epic)-[:ASSIGNED_TO]-(owner:Person)
        MATCH (e)-[:TEAM]-(team:Team)
        MATCH (e)-[:PART_OF]->(i:Initiative)
        RETURN e.key, e.summary,
               owner.name as owner, owner.title as owner_title,
               team.name as team,
               i.key as initiative,
               e.status, e.priority
        LIMIT 100
  graph: |-
    MATCH p1=(e:Epic)-[:ASSIGNED_TO]-(owner:Person)
        MATCH p2=(e)-[:TEAM]-(team:Team)
        MATCH p3=(e)-[:PART_OF]->(i:Initiative)
        RETURN p1, p2, p3
        LIMIT 100
tags:
- table
- graph
