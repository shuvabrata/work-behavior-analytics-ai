name: Initiatives with Assignees
description: |-
  **What it is:** Lists all strategic Initiatives along with their designated assignees and reporters.
  
  **How it helps:** Helps Management instantly identify the single-threaded leaders responsible for driving major business objectives to completion.
  
  **What-If Impact:** Initiatives without clear executive or senior leadership assignment often stall due to lack of decisive steering and cross-team unblocking.
summary: "Initiatives with assignees and reporters."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Initiative)-[:ASSIGNED_TO]-(assignee:Person),
              (i)-[:REPORTED_BY]-(reporter:Person)
        RETURN i.key, i.summary,
               assignee.name as assignee, assignee.title as assignee_title,
               reporter.name as reporter, reporter.title as reporter_title,
               i.status
        ORDER BY i.key
        LIMIT 100
  graph: |-
    MATCH p1=(i:Initiative)-[:ASSIGNED_TO]-(assignee:Person),
              (i)-[:REPORTED_BY]-(reporter:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
