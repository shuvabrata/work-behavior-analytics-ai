name: Orphaned Issues
description: |-
  **What it is:** Identifies isolated issues that are not linked to any parent Epic.
  
  **How it helps:** Acts as a data quality check for Program Managers to find stealth work or untracked operational overhead that is not rolling up to funded initiatives.
  
  **What-If Impact:** High volumes of orphaned issues indicate a breakdown in tracking discipline, meaning significant team effort is being expended on "dark work" invisible to leadership.
summary: "Issues not linked to any epic - Data Quality check."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)
        WHERE NOT (i)-[:PART_OF]->(:Epic)
        RETURN i.key, i.type, i.summary, i.status
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)
        WHERE NOT (i)-[:PART_OF]->(:Epic)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
