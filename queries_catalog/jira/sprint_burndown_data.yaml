name: Sprint Burndown Data
description: |-
  **What it is:** Calculates the total story points committed versus completed for issues within a specific sprint.
  
  **How it helps:** Helps Program Managers and Scrum Masters assess sprint delivery reliability and historical velocity, aiding in more accurate future sprint planning.
  
  **What-If Impact:** Inconsistent sprint burndown tracking obscures chronic over-commitment, leading to missed release targets and developer burnout.
summary: "Sprint progress and burndown metrics."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (s:Sprint)<-[:IN_SPRINT]-(i:Issue)
        RETURN s.name,
               sum(i.story_points) as total_points,
               sum(CASE WHEN i.status = 'Done' THEN i.story_points ELSE 0 END) as completed_points,
               count(i) as issue_count
        ORDER BY s.name
        LIMIT 100
  graph: |-
    MATCH p1=(s:Sprint)<-[:IN_SPRINT]-(i:Issue)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
