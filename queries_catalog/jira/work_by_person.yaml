name: Work by Person
description: |-
  **What it is:** Calculates the total number of issues and sum of story points assigned to each individual contributor.
  
  **How it helps:** Allows Management and Tech Leads to identify individuals who may be overloaded with concurrent tasks, guiding workload rebalancing within the team.
  
  **What-If Impact:** Failing to monitor individual workload distribution can result in quiet burnout and single points of failure for critical project deliverables.
summary: "Work assigned to each person."
default_view: tabular
owner: jira-analytics
status: draft
queries:
  tabular: |-
    MATCH (i:Issue)-[:ASSIGNED_TO]-(p:Person)
        RETURN p.name, p.title,
               count(i) as total_issues,
               sum(i.story_points) as total_points
        ORDER BY total_points DESC
        LIMIT 100
  graph: |-
    MATCH p1=(i:Issue)-[:ASSIGNED_TO]-(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
