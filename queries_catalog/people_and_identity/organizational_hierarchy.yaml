name: Organizational Hierarchy
description: |-
  **What it is:** Maps out the management reporting lines (manager-to-report relationships) across the entire engineering department.
  
  **How it helps:** Enables Executives to visualize the shape of the organization and identify whether management spans of control are too wide or too deep.
  
  **What-If Impact:** Obscured reporting structures make it difficult to cascade strategic goals effectively, leading to localized decision-making that contradicts broader company objectives.
summary: "View reporting structure."
default_view: graph
owner: identity-analytics
status: draft
queries:
  tabular: |-
    MATCH (p:Person)-[:REPORTS_TO]->(m:Person)
        RETURN p.name as employee, p.title, m.name as manager, m.title as manager_title
        ORDER BY m.name, p.name
        LIMIT 100
  graph: |-
    MATCH p1=(p:Person)-[:REPORTS_TO]->(m:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
