name: Team Distribution
description: |-
  **What it is:** Calculates the total headcount for each designated team across the organization.
  
  **How it helps:** Helps HR and Senior Engineering Leadership monitor organizational growth and verify that team sizing remains within manageable limits (e.g., standard two-pizza teams).
  
  **What-If Impact:** Over-sized teams naturally develop communication silos and management bottlenecks, severely degrading agile delivery cadence.
summary: "View team sizes."
default_view: graph
owner: identity-analytics
status: draft
queries:
  tabular: |-
    MATCH (t:Team)-[:MEMBER_OF]-(p:Person)
        RETURN t.name as team, count(p) as team_size
        ORDER BY team_size DESC
        LIMIT 100
  graph: |-
    MATCH p1=(t:Team)-[:MEMBER_OF]-(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
