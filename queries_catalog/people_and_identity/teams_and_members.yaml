name: Teams and Members
description: |-
  **What it is:** Lists all teams alongside their individual constituent members and their respective roles.
  
  **How it helps:** Provides Program Managers and Tech Leads with a definitive directory to quickly locate domain experts or assign cross-team dependencies.
  
  **What-If Impact:** Relying on outdated or informal team rosters leads to misdirected communication, lost requests, and stalled cross-team collaboration.
summary: "View all teams and their members."
default_view: graph
owner: identity-analytics
status: draft
queries:
  tabular: |-
    MATCH (t:Team)-[:MEMBER_OF]-(p:Person)
        RETURN t.name, collect(p.name) as members
        ORDER BY t.name
        LIMIT 100
  graph: |-
    MATCH p1=(t:Team)-[:MEMBER_OF]-(p:Person)
        RETURN p1
        LIMIT 100
tags:
- table
- graph
