name: Teams Managed
description: |-
  **What it is:** Finds all Teams that this person manages via the MANAGES relationship.

  **How it helps:** Distinguishes between being a team member (MEMBER_OF) and being a team manager (MANAGES). A person managing multiple teams simultaneously is either a VP-level leader or potentially overextended. This query makes that distinction concrete.

  **What-If Impact:** In rapidly scaling organisations, engineering managers sometimes quietly accumulate management responsibility for multiple teams without this being formally reflected anywhere. This query makes that invisible expansion of scope visible.
summary: All teams this person manages.
default_view: graph
parameters:
- name: person_id
  env_var: PERSON1_ID
  required: true
  label: Person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  graph: |-
    MATCH path = (p:Person {id: $person_id})-[:MANAGES]->(t:Team)
    RETURN path
    LIMIT 50
  tabular: |-
    MATCH (p:Person {id: $person_id})-[:MANAGES]->(t:Team)
    RETURN t.name AS team_name,
           t.id AS team_id
    ORDER BY t.name ASC
    LIMIT 50
tags:
- table
- graph
owner: graph-team
status: draft