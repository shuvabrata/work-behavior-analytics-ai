name: Team Memberships
description: |-
  **What it is:** Shows all Teams this person belongs to, visualised as a graph of person-to-team connections.

  **How it helps:** Reveals multi-team membership patterns. A person on many teams is either a cross-functional liaison or dangerously spread — context determines which. This is the baseline query for understanding a person's formal organisational positioning.

  **What-If Impact:** A person quietly removed from a team may lose access to context and communication channels without anyone noticing. Tracking team membership is foundational for access audits and organisational change management.
summary: All teams this person is a member of.
default_view: graph
parameters:
- name: person_id
  env_var: PERSON1_ID
  required: true
  label: Person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  graph: |-
    MATCH path = (p:Person {id: $person_id})-[:MEMBER_OF]-(t:Team)
    RETURN path
    LIMIT 50
  tabular: |-
    MATCH (p:Person {id: $person_id})-[:MEMBER_OF]-(t:Team)
    RETURN t.name AS team_name,
           t.id AS team_id
    ORDER BY t.name ASC
    LIMIT 50
tags:
- beta
- table
- graph
owner: graph-team
status: active
