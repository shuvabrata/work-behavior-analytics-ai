name: All Shortest Paths Collaboration
description: |-
  **What it is:** Discovers all possible shortest communication paths between two people when multiple equally direct routes exist.
  
  **How it helps:** Helps Engineering Directors map network resilience, ensuring that critical communication isn't entirely dependent on a single intermediary person.
  
  **What-If Impact:** Assuming only one collaboration path exists creates artificial bottlenecks and single points of failure in organizational communication.
summary: Show every shortest collaboration path between two people.
default_view: graph
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = allShortestPaths((p1)-[*..6]-(p2))
    WITH p1, p2, path, [n IN nodes(path)[1..-1] | coalesce(n.id, elementId(n))] AS intermediates
    WITH p1, p2, intermediates, collect(path)[0] AS path
    RETURN p1.name as person1,
           p2.name as person2,
           length(path) as degrees_of_separation,
           [n IN nodes(path) | coalesce(n.name, n.key, n.title, n.path, labels(n)[0])] as connection_path,
           [r IN relationships(path) | type(r)] as relationship_types
    LIMIT 10
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = allShortestPaths((p1)-[*..6]-(p2))
    WITH path, [n IN nodes(path)[1..-1] | coalesce(n.id, elementId(n))] AS intermediates
    WITH intermediates, collect(path)[0] AS path
    RETURN path
    LIMIT 10
tags:
- table
- graph
owner: graph-team
status: draft