name: Direct Code Reviews
description: |-
  **What it is:** Identifies Pull Requests authored by one specific developer that were reviewed by another specific developer.
  
  **How it helps:** Enables Tech Leads to audit peer review pairings and identify potential echo chambers where two developers exclusively review each other's code.
  
  **What-If Impact:** Exclusive code review pairings often lead to a degradation of code standards, as reviewers become complacent and stop challenging architectural decisions.
summary: Compare two people by direct code review activity.
default_view: tabular
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH (author:Person)-[:CREATED_BY]-(pr:PullRequest)-[:REVIEWED_BY]-(reviewer:Person)
    WHERE (author = p1 AND reviewer = p2) OR (author = p2 AND reviewer = p1)
    RETURN author.name as author,
           reviewer.name as reviewer,
           count(pr) as review_count,
           collect(pr.number)[0..5] as sample_prs
    ORDER BY review_count DESC
        LIMIT 100
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = (author:Person)-[:CREATED_BY]-(pr:PullRequest)-[:REVIEWED_BY]-(reviewer:Person)
    WHERE (author = p1 AND reviewer = p2) OR (author = p2 AND reviewer = p1)
    RETURN path
    LIMIT 100
tags:
- table
- graph
owner: graph-team
status: draft