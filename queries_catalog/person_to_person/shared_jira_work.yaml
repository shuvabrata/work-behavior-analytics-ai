name: Shared Jira Work
description: |-
  **What it is:** Finds Jira issues where one person acted as the reporter and the other was the assigned developer.
  
  **How it helps:** Helps Product Managers assess the feedback loop between an internal customer (or QA) and the engineer tasked with addressing the request.
  
  **What-If Impact:** A lack of shared Jira work between a product owner and a lead developer often signals a massive disconnect in requirements gathering and execution.
summary: Compare two people by shared Jira reporting and assignment activity.
default_view: tabular
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH (reporter:Person)-[:REPORTED_BY]-(issue:Issue)-[:ASSIGNED_TO]-(assignee:Person)
    WHERE (reporter = p1 AND assignee = p2) OR (reporter = p2 AND assignee = p1)
    RETURN reporter.name as reporter,
           assignee.name as assignee,
           count(issue) as issue_count,
           collect(issue.key)[0..5] as sample_issues
    ORDER BY issue_count DESC
        LIMIT 100
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = (reporter:Person)-[:REPORTED_BY]-(issue:Issue)-[:ASSIGNED_TO]-(assignee:Person)
    WHERE (reporter = p1 AND assignee = p2) OR (reporter = p2 AND assignee = p1)
    RETURN path
    LIMIT 100
tags:
- table
- graph
owner: graph-team
status: draft