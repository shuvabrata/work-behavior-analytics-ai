name: Shared Repositories
description: |-
  **What it is:** Lists the GitHub repositories where both individuals have actively pushed code or conducted reviews.
  
  **How it helps:** Provides Engineering Directors with a macro-level view of which specific services act as integration points for the two developers.
  
  **What-If Impact:** Assuming two developers collaborate heavily just because they sit together ignores the fact that their work may touch entirely isolated microservices.
summary: Compare two people by the repositories where they both collaborate.
default_view: tabular
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id})-[c1:COLLABORATOR]-(r:Repository)-[c2:COLLABORATOR]-(p2:Person {id: $person2_id})
    RETURN r.name as repository,
           c1.permission as person1_permission,
           c2.permission as person2_permission
    ORDER BY repository
        LIMIT 100
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = (p1)-[c1:COLLABORATOR]-(r:Repository)-[c2:COLLABORATOR]-(p2)
    RETURN path
    LIMIT 100
tags:
- table
- graph
owner: graph-team
status: draft