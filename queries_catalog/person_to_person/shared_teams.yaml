name: Shared Teams
description: |-
  **What it is:** Identifies any organizational teams or working groups where two specific individuals share overlapping membership.
  
  **How it helps:** Helps Engineering Managers uncover existing collaborative structures between two people when attempting to resolve interpersonal friction or plan resource transfers.
  
  **What-If Impact:** Failing to understand shared team contexts can lead managers to misdiagnose the root cause of communication breakdowns between engineers.
summary: Compare two people by the teams they share.
default_view: tabular
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id})-[:MEMBER_OF]-(t:Team)-[:MEMBER_OF]-(p2:Person {id: $person2_id})
    RETURN p1.name as person1,
           p2.name as person2,
           t.name as shared_team
        LIMIT 100
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = (p1)-[:MEMBER_OF]-(t:Team)-[:MEMBER_OF]-(p2)
    RETURN path
    LIMIT 100
tags:
- table
- graph
owner: graph-team
status: draft