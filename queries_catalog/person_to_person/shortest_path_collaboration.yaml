name: Shortest Path Collaboration
description: |-
  **What it is:** Finds the single shortest path of collaboration between two people, traversing across all domains (Jira, GitHub, Confluence, Teams).

  **How it helps:** Acts as the definitive starting query for Organizational Network Analysis to understand how knowledge actually flows across the company.

  **What-If Impact:** Without cross-domain pathing, leadership is blind to the informal networks that actually hold the company together when formal processes fail.
summary: Trace the single shortest collaboration path between two people across domains.
default_view: graph
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = shortestPath((p1)-[*..6]-(p2))
    RETURN p1.name as person1,
           p2.name as person2,
           length(path) as degrees_of_separation,
           [n IN nodes(path) | coalesce(n.name, n.key, n.title, n.path, labels(n)[0])] as connection_path,
           [r IN relationships(path) | type(r)] as relationship_types
    LIMIT 1
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = shortestPath((p1)-[*..6]-(p2))
    RETURN path
    LIMIT 1
tags:
- table
- graph
owner: graph-team
status: draft