name: Shortest Paths Through Work Artifacts
description: |-
  **What it is:** Calculates the most direct collaboration path between two people by traversing only work-collaboration relationships across Jira, GitHub, and Confluence — assignments, reporting, authorship, reviews, mentions, comments, reactions, and the structural links between work items (part-of, references, includes, modifies, blocks, depends-on).

  **How it helps:** Helps coaches and leads distinguish genuine hands-on collaboration from incidental co-membership. Team membership and repository access alone never connect two people; only concrete shared work does.

  **What-If Impact:** Assuming two people collaborate just because they share a team or repo inflates collaboration metrics with false positives, hiding the reality that they may work on entirely disjoint artifacts.
summary: Trace the shortest cross-domain work-artifact connection between two people.
default_view: graph
parameters:
- name: person1_id
  env_var: PERSON1_ID
  required: true
  label: First person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
- name: person2_id
  env_var: PERSON2_ID
  required: true
  label: Second person
  type: person_id
  placeholder: "e.g. github::Person::alice or jira::Person::557058:abc"
  description: "WBA canonical Person ID. Format: github::Person::<login> or jira::Person::<account_id>"
queries:
  tabular: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = allShortestPaths((p1)-[:ASSIGNED_TO|REPORTED_BY|AUTHORED_BY|MENTIONS|COMMENTED_ON|REACTED_TO|CREATED_BY|REVIEWED_BY|REQUESTED_REVIEWER|MERGED_BY|MODIFIED|RELATES_TO|PART_OF|REFERENCES|INCLUDES|MODIFIES|BLOCKS|DEPENDS_ON*..10]-(p2))
    WITH p1, p2, path, [n IN nodes(path)[1..-1] | coalesce(n.id, elementId(n))] AS intermediates
    WITH p1, p2, intermediates, collect(path)[0] AS path
    RETURN p1.name as person1,
           p2.name as person2,
           length(path) as degrees_of_separation,
           [n IN nodes(path) | coalesce(n.name, n.key, n.title, n.path, n.sha, labels(n)[0])] as connection_path,
           [r IN relationships(path) | type(r)] as relationship_types
    LIMIT 10
  graph: |-
    MATCH (p1:Person {id: $person1_id}), (p2:Person {id: $person2_id})
    MATCH path = allShortestPaths((p1)-[:ASSIGNED_TO|REPORTED_BY|AUTHORED_BY|MENTIONS|COMMENTED_ON|REACTED_TO|CREATED_BY|REVIEWED_BY|REQUESTED_REVIEWER|MERGED_BY|MODIFIED|RELATES_TO|PART_OF|REFERENCES|INCLUDES|MODIFIES|BLOCKS|DEPENDS_ON*..10]-(p2))
    WITH path, [n IN nodes(path)[1..-1] | coalesce(n.id, elementId(n))] AS intermediates
    WITH intermediates, collect(path)[0] AS path
    RETURN path
    LIMIT 10
tags:
- table
- graph
owner: graph-team
status: draft