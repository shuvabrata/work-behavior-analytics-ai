name: View All Node Types
description: |-
  **What it is:** Counts all database nodes grouped by their label (e.g., Issue, Person, Commit).
  
  **How it helps:** Helps administrators and leads verify that data from various tools (Jira, GitHub, Confluence) has successfully ingested, providing a baseline for downstream analytics models.
  
  **What-If Impact:** Skipping this verification can lead to running analytics on incomplete datasets without realizing ingestion errors occurred.
summary: "Count all nodes by type."
default_view: tabular
owner: graph-platform
status: draft
queries:
  tabular: |-
    MATCH (n)
        RETURN labels(n)[0] as type, count(*) as count
        ORDER BY count DESC
        LIMIT 100
  graph: |-
    CALL db.schema.visualization()
tags:
- table
- graph
